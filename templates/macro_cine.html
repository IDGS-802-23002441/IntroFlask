{% macro campoNuevo(field) %}
<div class="mb-2">
    <label>{{ field.label }}</label>
    {{ field(**kwargs)|safe }}
    {% if field.errors %}
        {% for error in field.errors %}
            <div style="color: rgb(255, 0, 0);">
                {{ error }}
            </div>
        {% endfor %}
    {% endif %}
</div>
{% endmacro %}
